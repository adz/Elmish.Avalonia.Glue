name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check release notes
        run: bash scripts/check-release-notes.sh

      - name: Restore
        run: dotnet restore Elmish.Avalonia.Glue.Build.slnf

      - name: Build
        run: dotnet build Elmish.Avalonia.Glue.Build.slnf --configuration Release --no-restore --nologo -v minimal -m:1

      - name: Test
        run: dotnet test Elmish.Avalonia.Glue.Build.slnf --configuration Release --no-build --nologo -v minimal

      - name: Pack libraries
        run: bash scripts/pack.sh
